<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>H X T T L X S</title>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --hero-size: min(60vw, 60vh);
  }
  * { box-sizing: border-box; }
  html {
    touch-action: manipulation;
  }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #ffffff;
    font-family: 'Courier New', monospace;
    user-select: none;
    touch-action: manipulation;
    position: relative;
  }

  /* Barra superior tipo menubar */
  .menubar {
    height: 28px;
    background: #9ca88f;
    color: #f5f5f0;
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 13px;
    letter-spacing: 0.5px;
    justify-content: space-between;
  }
  .menubar-logo {
    height: 18px;
    width: auto;
    display: block;
  }

  /* Iconos de carpetas en el escritorio */
  .desktop {
    position: relative;
    height: calc(100% - 28px - 46px);
    padding: 24px;
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: flex-start;
    align-content: flex-start;
    gap: calc(var(--hero-size) * 0.055);
  }
  .folder {
    width: auto;
    text-align: center;
    cursor: pointer;
    color: #4a5543;
    text-shadow: none;
    display: inline-block;
    margin: 0 12px 12px 0;
    position: relative;
    z-index: 1;
  }
  .icon-slot {
    height: calc(var(--hero-size) * 0.36);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 8px;
  }
  .folder-icon {
    width: calc(var(--hero-size) * 0.30);
    max-height: 100%;
    height: auto;
    object-fit: contain;
    transition: transform 0.15s ease;
    display: block;
  }
  .folder-icon-grande {
    width: calc(var(--hero-size) * 0.36);
    max-height: 100%;
  }
  .folder-icon-css {
    width: calc(var(--hero-size) * 0.195);
    height: calc(var(--hero-size) * 0.1575);
    margin: 0 auto;
    background: #ECD06F;
    border-radius: 3px 6px 6px 6px;
    position: relative;
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    transition: transform 0.15s ease;
  }
  .folder-icon-css::before {
    content: '';
    position: absolute;
    top: calc(var(--hero-size) * -0.03); left: 0;
    width: calc(var(--hero-size) * 0.09); height: calc(var(--hero-size) * 0.03);
    background: #ECD06F;
    border-radius: 3px 3px 0 0;
  }
  .folder:hover .folder-icon { transform: translateY(-3px) scale(1.05); }
  .folder:hover .folder-icon-grande { transform: translateY(-3px) scale(1.05); }
  .folder:hover .folder-icon-css { transform: translateY(-3px) scale(1.05); }
  .folder-label { font-size: clamp(9px, calc(var(--hero-size) * 0.042), 18px); }

  /* Ventana */
  .window {
    position: absolute;
    top: 90px;
    left: 140px;
    width: 380px;
    min-width: 220px;
    min-height: 160px;
    background: #f4f1ea;
    border: 1.5px solid #1a1a1a;
    border-radius: 8px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 5;
  }
  .window.open { display: flex; }
  .window-titlebar {
    height: 34px;
    background: #9ca88f;
    display: flex;
    align-items: center;
    padding: 0 12px;
    cursor: move;
    gap: 8px;
  }
  .window-close {
    color: #1a1a1a;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background 0.15s ease;
  }
  .window-close:hover {
    background: rgba(0,0,0,0.12);
  }
  .window-title {
    color: #f5f5f0;
    font-size: 12px;
    margin-left: 4px;
    flex: 1;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .window-body {
    padding: 18px;
    color: #2c2c2c;
    font-size: 14px;
    line-height: 1.5;
    overflow: auto;
  }
  .window-body h3 { margin-top: 0; font-family: Georgia, serif; }
  .window-body-icons {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .project-icon-inside {
    width: 100%;
    max-width: 260px;
    height: auto;
    object-fit: contain;
  }

  .resize-handle {
    position: absolute;
    width: 16px; height: 16px;
    right: 0; bottom: 0;
    cursor: nwse-resize;
  }

  /* Dock inferior */
  .dock {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 46px;
    background: #9ca88f;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .dock-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: #ECD06F;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .dock-icon:hover { transform: translateY(-6px) scale(1.1); }

  /* Icono grande centrado de fondo */
  .hero-icon {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: var(--hero-size);
    height: var(--hero-size);
    object-fit: contain;
    opacity: 0.9;
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>
<body>

<div class="menubar">
  <img src="images/hattlas-logo.png" class="menubar-logo" alt="HATTLAS">
  <span id="clock">--:--</span>
</div>

<div class="desktop">
  <img src="images/hattlas-logo.png" class="hero-icon" alt="">
  <div class="folder" onclick="openWindow('proyectos')">
    <div class="icon-slot"><img src="images/proyecto-icon-2.svg" class="folder-icon folder-icon-grande" alt="Proyectos"></div>
    <div class="folder-label">Proyectos</div>
  </div>
  <div class="folder" onclick="openWindow('coleccion')">
    <div class="icon-slot"><img src="images/coleccion-icon.png" class="folder-icon" alt="Colección"></div>
    <div class="folder-label">Colección</div>
  </div>
  <div class="folder" onclick="openWindow('contacto')">
    <div class="icon-slot"><img src="images/proyecto-icon-vectorizado_nuevo.svg" class="folder-icon" alt="Contacto"></div>
    <div class="folder-label">Contacto</div>
  </div>
</div>

<div class="dock">
  <div class="dock-icon" onclick="openWindow('proyectos')"></div>
  <div class="dock-icon" onclick="openWindow('coleccion')"></div>
  <div class="dock-icon" onclick="openWindow('contacto')"></div>
</div>

<!-- Ventanas -->
<div class="window" id="win-proyectos" style="top:80px; left:120px;">
  <div class="window-titlebar" data-win="proyectos">
    <div class="window-close" onclick="closeWindow('proyectos')">×</div>
    <div class="window-title">Proyectos</div>
  </div>
  <div class="window-body window-body-icons">
    <img src="images/proyecto-icon-2.svg" class="project-icon-inside" alt="Proyecto">
  </div>
  <div class="resize-handle"></div>
</div>

<div class="window" id="win-coleccion" style="top:70px; left:100px; width:460px;">
  <div class="window-titlebar" data-win="coleccion">
    <div class="window-close" onclick="closeWindow('coleccion')">×</div>
    <div class="window-title">Colección</div>
  </div>
  <div class="window-body !p-5">
    <div class="grid grid-cols-2 gap-4">

      <!-- Item 1 -->
      <div class="bg-white rounded-lg overflow-hidden shadow-md flex flex-col">
        <img src="images/proyecto-icon-2.svg" alt="Obra 1"
             class="w-full aspect-square object-contain bg-[#f4f1ea] p-3">
        <div class="p-3 text-center">
          <p class="text-sm font-bold text-zinc-800 m-0 mb-0.5">Nombre de la obra</p>
          <p class="text-xs text-zinc-500 m-0 mb-3">$0.00 USD</p>
          <a href="https://buy.stripe.com/REEMPLAZAR-LINK-1" target="_blank"
             class="inline-block bg-zinc-800 text-white text-xs px-4 py-1.5 rounded-full
                    hover:bg-teal-500 transition-colors duration-150">
            Comprar
          </a>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="bg-white rounded-lg overflow-hidden shadow-md flex flex-col">
        <img src="images/proyecto-icon-2.svg" alt="Obra 2"
             class="w-full aspect-square object-contain bg-[#f4f1ea] p-3">
        <div class="p-3 text-center">
          <p class="text-sm font-bold text-zinc-800 m-0 mb-0.5">Nombre de la obra</p>
          <p class="text-xs text-zinc-500 m-0 mb-3">$0.00 USD</p>
          <a href="https://buy.stripe.com/REEMPLAZAR-LINK-2" target="_blank"
             class="inline-block bg-zinc-800 text-white text-xs px-4 py-1.5 rounded-full
                    hover:bg-teal-500 transition-colors duration-150">
            Comprar
          </a>
        </div>
      </div>

    </div>
  </div>
  <div class="resize-handle"></div>
</div>

<div class="window" id="win-contacto" style="top:180px; left:180px;">
  <div class="window-titlebar" data-win="contacto">
    <div class="window-close" onclick="closeWindow('contacto')">×</div>
    <div class="window-title">Contacto</div>
  </div>
  <div class="window-body">
    <h3 class="text-lg font-serif mb-3">Hablemos</h3>
    <p class="text-sm leading-relaxed text-zinc-700">
      hello@ejemplo.com<br>
      Instagram · LinkedIn · Behance
    </p>
  </div>
  <div class="resize-handle"></div>
</div>

<script>
  // Reloj en tiempo real
  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  }
  tick();
  setInterval(tick, 1000 * 30);

  let topZ = 10;

  // Bloquea el pinch-zoom en iOS/Safari (que ignora user-scalable=no)
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('gesturechange', (e) => e.preventDefault());
  document.addEventListener('gestureend', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  // Bloquea el doble-tap-para-zoom
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, false);

  // Tamaño real de la página: se mide directo del body, el mismo
  // contenedor del que dependen la barra superior, el dock y el fondo.
  // Así las ventanas modales nunca quedan desfasadas respecto al resto,
  // incluso en escenarios de iPad (Split View / Stage Manager) donde
  // window.innerWidth puede no coincidir exactamente con el layout real.
  function getViewportHeight() {
    return document.body.getBoundingClientRect().height;
  }
  function getViewportWidth() {
    return document.body.getBoundingClientRect().width;
  }

  // Mantener las ventanas dentro de los límites cuando cambia el tamaño de la pantalla
  function clampWindowToViewport(win) {
    const maxW = getViewportWidth();
    const maxH = getViewportHeight();

    if (win.offsetWidth > maxW) {
      win.style.width = Math.max(220, maxW) + 'px';
    }
    if (win.offsetHeight > maxH) {
      win.style.height = Math.max(160, maxH) + 'px';
    }

    const winW = win.offsetWidth;
    const winH = win.offsetHeight;
    const maxLeft = Math.max(maxW - winW, 0);
    const maxTop = Math.max(maxH - winH, 0);

    const currentLeft = win.offsetLeft;
    const currentTop = win.offsetTop;

    win.style.left = Math.min(Math.max(currentLeft, 0), maxLeft) + 'px';
    win.style.top = Math.min(Math.max(currentTop, 0), maxTop) + 'px';
  }

  function clampAllOpenWindows() {
    document.querySelectorAll('.window.open').forEach(clampWindowToViewport);
  }

  function handleViewportChange() {
    clampAllOpenWindows();
  }
  window.addEventListener('resize', handleViewportChange);
  window.addEventListener('orientationchange', handleViewportChange);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleViewportChange);
    window.visualViewport.addEventListener('scroll', handleViewportChange);
  }

  function openWindow(id) {
    const win = document.getElementById('win-' + id);
    win.classList.add('open');
    focusWindow(win);
    clampWindowToViewport(win);
  }
  function closeWindow(id) {
    document.getElementById('win-' + id).classList.remove('open');
  }
  function focusWindow(win) {
    topZ++;
    win.style.zIndex = topZ;
  }

  // Arrastrar ventanas
  document.querySelectorAll('.window-titlebar').forEach(bar => {
    bar.style.touchAction = 'none';
    bar.addEventListener('pointerdown', startDrag);
  });

  function startDrag(e) {
    if (e.target.classList.contains('window-close')) return;
    const win = e.currentTarget.closest('.window');
    focusWindow(win);
    const rect = win.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;
    e.currentTarget.setPointerCapture(e.pointerId);

    function onMove(ev) {
      const winW = win.offsetWidth;
      const winH = win.offsetHeight;
      const maxLeft = getViewportWidth() - winW;
      const maxTop = getViewportHeight() - winH;

      let newLeft = ev.clientX - offsetX;
      let newTop = ev.clientY - offsetY;

      newLeft = Math.min(Math.max(newLeft, 0), Math.max(maxLeft, 0));
      newTop = Math.min(Math.max(newTop, 0), Math.max(maxTop, 0));

      win.style.left = newLeft + 'px';
      win.style.top = newTop + 'px';
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
      handleViewportChange();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  // Redimensionar ventanas
  document.querySelectorAll('.resize-handle').forEach(handle => {
    handle.style.touchAction = 'none';
    handle.addEventListener('pointerdown', startResize);
  });

  function startResize(e) {
    e.stopPropagation();
    const win = e.target.closest('.window');
    focusWindow(win);
    const startX = e.clientX, startY = e.clientY;
    const startW = win.offsetWidth, startH = win.offsetHeight;
    const winRect = win.getBoundingClientRect();
    e.target.setPointerCapture(e.pointerId);

    function onMove(ev) {
      const maxW = getViewportWidth() - winRect.left;
      const maxH = getViewportHeight() - winRect.top;

      const newW = Math.min(Math.max(220, startW + (ev.clientX - startX)), maxW);
      const newH = Math.min(Math.max(160, startH + (ev.clientY - startY)), maxH);

      win.style.width = newW + 'px';
      win.style.height = newH + 'px';
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      try { e.target.releasePointerCapture(e.pointerId); } catch (err) {}
      handleViewportChange();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  // Click en ventana la trae al frente
  document.querySelectorAll('.window').forEach(win => {
    win.addEventListener('pointerdown', () => focusWindow(win));
  });
</script>

</body>
</html>
